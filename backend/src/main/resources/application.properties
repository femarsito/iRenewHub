# =============================================
# BASE DE DATOS - PostgreSQL
# =============================================
# Spring Boot necesita saber DONDE esta la BD y COMO conectarse.

spring.datasource.url=jdbc:postgresql://localhost:5432/irenewhub
# Direccion de la BD:
#   jdbc:postgresql  = protocolo (usamos PostgreSQL)
#   localhost        = la BD esta en tu propio ordenador
#   5432             = puerto por defecto de PostgreSQL
#   irenewhub        = nombre de la base de datos que creaste en pgAdmin

spring.datasource.username=postgres
# Usuario de PostgreSQL con el que se conecta (creado al instalar Postgres)

spring.datasource.password=280304
# Contrasena de ese usuario de PostgreSQL

spring.datasource.driver-class-name=org.postgresql.Driver
# El "traductor" entre Java y PostgreSQL.



# =============================================
# JPA / HIBERNATE
# =============================================
# JPA es la capa de Java que convierte objetos Java en filas de tabla y viceversa.
# Hibernate es la implementacion concreta de JPA que usa Spring Boot.

spring.jpa.hibernate.ddl-auto=update
# Que hace Hibernate con las tablas al arrancar la app:
#   update = si la tabla NO existe la CREA; si ya existe la ACTUALIZA
#   create = borra todo y crea de cero cada vez (PELIGROSO: pierdes datos)
#   none   = no toca nada (para produccion real)
# Con "update": si anaides un campo a una entidad Java, Hibernate crea la columna solo.

spring.jpa.show-sql=true
# Muestra en consola cada consulta SQL que ejecuta Hibernate.
# Util para depurar: ves exactamente que SELECT/INSERT/UPDATE se lanza.

spring.jpa.properties.hibernate.format_sql=true
# Formatea el SQL que se muestra en consola para que sea legible.
# Sin esto el SQL aparece en una sola linea larga y es dificil de leer.

spring.jpa.open-in-view=false
# Desactiva un patron que mantiene la conexion a BD abierta durante todo el ciclo HTTP.
# Con false la conexion se abre y cierra solo dentro del @Service (mas eficiente).


# =============================================
# SERVIDOR
# =============================================

server.port=8080
# Puerto en el que escucha el backend. Por eso todas las llamadas son:
# http://localhost:8080/api/...
# Si cambias esto, tambien hay que cambiarlo en el frontend (services/).


# =============================================
# APP
# =============================================

spring.application.name=irenewhub-backend
# Nombre interno de la aplicacion. Aparece en los logs al arrancar.
# No afecta al funcionamiento, es solo identificativo.


# =============================================
# JWT (JSON Web Token)
# =============================================
# JWT es el sistema de autenticacion:
# Al hacer login el backend genera un "token" firmado.
# El frontend lo guarda y lo manda en cada peticion.
# El backend verifica la firma para saber que eres tu.

jwt.secret=irenewhub-secret-key-2024-very-long-and-secure-key-for-jwt-signing
# Clave secreta con la que se FIRMA el token. Solo el backend la conoce.
# Si alguien la descubre puede fabricar tokens falsos y tener acceso total.
# JwtService.java lee este valor con @Value("${jwt.secret}")

jwt.expiration=86400000
# Tiempo de vida del token en milisegundos. 86400000 ms = 24 horas.
# Pasadas 24h el token expira y el usuario tiene que volver a hacer login.
# Calculo: 86400000 / 1000 / 60 / 60 = 24 horas


# =============================================
# STRIPE (modo test - sin cobros reales)
# Las claves empiezan por sk_test_ y pk_test_ = NUNCA cobran dinero real.
# Las claves de produccion empezarian por sk_live_ y pk_live_.
# =============================================

stripe.secret.key=${STRIPE_SECRET_KEY}
# Clave PRIVADA de Stripe. Solo la usa el backend (nunca llega al navegador).
# Con ella se crean PaymentIntents (ordenes de cobro) en el servidor de Stripe.
# PaymentController.java la lee con @Value("${stripe.secret.key}")

stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}
# Clave PUBLICA de Stripe. El backend la envia al frontend cuando este la pide.
# El frontend (checkout.ts) la usa para inicializar @stripe/stripe-js
# y montar el formulario de tarjeta de forma segura.


# =============================================
# EMAIL - Gmail SMTP (para recuperacion de contrasena)
# SMTP es el protocolo estandar para enviar emails.
# JavaMailSender actua como cliente SMTP y manda emails desde tu cuenta Gmail.
# =============================================

spring.mail.host=smtp.gmail.com
# Servidor de correo saliente de Gmail. Spring se conecta aqui para mandar emails.

spring.mail.port=587
# Puerto SMTP con cifrado STARTTLS (el estandar seguro de Gmail).

spring.mail.username=fermarcor280304@gmail.com
# Cuenta Gmail desde la que SE ENVIAN los emails de recuperacion de contrasena.
# EmailService.java usa este valor como remitente (el "De:" del email).

spring.mail.password=ivrahfblzasuxitw
# App Password generado por Google (NO es tu contrasena normal de Gmail).
# Google exige esto porque las contrasenas normales estan bloqueadas para apps externas.
# Se genera en: myaccount.google.com/apppasswords (requiere verificacion en 2 pasos)

spring.mail.properties.mail.smtp.auth=true
# Le dice al cliente SMTP que se autentique con usuario y contrasena antes de enviar.
# Sin esto Gmail rechaza la conexion.

spring.mail.properties.mail.smtp.starttls.enable=true
# Activa el cifrado STARTTLS: la conexion empieza sin cifrar y luego pasa a cifrada.
# Asi los datos viajan seguros entre tu servidor y Gmail.
